components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: "Token del servicio (Authorization: Bearer <token>)"
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Código estable en inglés, para programas
            message:
              type: string
              description: Explicación en español, para personas
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
      description: Error uniforme de toda la API
    Assignment:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        diskId:
          type: string
          minLength: 1
        folder:
          type: string
        role:
          type: string
          enum:
            - storage
            - backup
        label:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - diskId
        - folder
        - role
        - label
        - createdAt
      additionalProperties: false
    AuditEntry:
      type: object
      properties:
        seq:
          type: integer
        id:
          type: string
          minLength: 1
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        details:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - seq
        - id
        - at
        - actor
        - action
        - target
        - details
      additionalProperties: false
    AuditPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: integer
          minimum: 0
      required:
        - entries
        - nextCursor
      additionalProperties: false
    Capacity:
      type: object
      properties:
        totalBytes:
          type: integer
          minimum: 0
        usedBytes:
          type: integer
          minimum: 0
        freeBytes:
          type: integer
          minimum: 0
        freePercent:
          type: number
        daysUntilFull:
          type:
            - number
            - "null"
      required:
        - totalBytes
        - usedBytes
        - freeBytes
        - freePercent
        - daysUntilFull
      additionalProperties: false
    ConfirmPlanRequest:
      type: object
      properties:
        confirm:
          type: boolean
      required:
        - confirm
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - name
    DeletionOrder:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        items:
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
                minLength: 1
              path:
                type: string
            required:
              - sourceId
              - path
            additionalProperties: false
        createdAt:
          type: string
          format: date-time
        requestedBy:
          type: string
        status:
          type: string
          enum:
            - pending
            - completed
        targets:
          type: array
          items:
            type: object
            properties:
              orderId:
                type: string
                minLength: 1
              destinationId:
                type: string
                minLength: 1
              status:
                type: string
                enum:
                  - pending
                  - done
              attempts:
                type: integer
              lastError:
                type:
                  - string
                  - "null"
              doneAt:
                anyOf:
                  - type: string
                    format: date-time
                  - type: "null"
            required:
              - orderId
              - destinationId
              - status
              - attempts
              - lastError
              - doneAt
            additionalProperties: false
      required:
        - id
        - projectId
        - items
        - createdAt
        - requestedBy
        - status
        - targets
      additionalProperties: false
    DeletionRequest:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            type: object
            properties:
              sourceId:
                type: string
                minLength: 1
              path:
                type: string
                minLength: 1
            required:
              - sourceId
              - path
        destinations:
          minItems: 1
          type: array
          items:
            type: string
            minLength: 1
      required:
        - items
    Disk:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        serial:
          type:
            - string
            - "null"
        wwn:
          type:
            - string
            - "null"
        model:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        bus:
          type: string
          enum:
            - usb
            - sata
            - nvme
            - sas
            - other
        devicePath:
          type: string
        mountPath:
          type:
            - string
            - "null"
        connected:
          type: boolean
        state:
          type: string
          enum:
            - unassigned
            - assigned
        health:
          type: string
          enum:
            - green
            - yellow
            - red
            - unknown
        healthReasons:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        smart:
          anyOf:
            - $ref: "#/components/schemas/SmartSnapshot"
            - type: "null"
        capacity:
          anyOf:
            - $ref: "#/components/schemas/Capacity"
            - type: "null"
        capacityLow:
          type: boolean
        assignments:
          type: array
          items:
            type: object
            properties:
              assignmentId:
                type: string
                minLength: 1
              projectId:
                type: string
                minLength: 1
              folder:
                type: string
              role:
                type: string
                enum:
                  - storage
                  - backup
              label:
                type: string
            required:
              - assignmentId
              - projectId
              - folder
              - role
              - label
            additionalProperties: false
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - serial
        - wwn
        - model
        - sizeBytes
        - bus
        - devicePath
        - mountPath
        - connected
        - state
        - health
        - healthReasons
        - advisories
        - smart
        - capacity
        - capacityLow
        - assignments
        - firstSeenAt
        - lastSeenAt
      additionalProperties: false
    Event:
      oneOf:
        - type: object
          properties:
            seq:
              type: integer
              exclusiveMinimum: 0
            id:
              type: string
              minLength: 1
            type:
              type: string
              const: disk.detected
            occurredAt:
              type: string
              format: date-time
            payload:
              type: object
              properties:
                diskId:
                  type: string
                serial:
                  type:
                    - string
                    - "null"
                wwn:
                  type:
                    - string
                    - "null"
                model:
                  type: string
                sizeBytes:
                  type: integer
                  minimum: 0
                mountPath:
                  type:
                    - string
                    - "null"
              required:
                - diskId
                - serial
                - wwn
                - model
                - sizeBytes
                - mountPath
              additionalProperties: false
          required:
            - seq
            - id
            - type
            - occurredAt
            - payload
          additionalProperties: false
        - type: object
          properties:
            seq:
              type: integer
              exclusiveMinimum: 0
            id:
              type: string
              minLength: 1
            type:
              type: string
              const: disk.health_changed
            occurredAt:
              type: string
              format: date-time
            payload:
              type: object
              properties:
                diskId:
                  type: string
                previous:
                  type: string
                  enum:
                    - green
                    - yellow
                    - red
                    - unknown
                current:
                  type: string
                  enum:
                    - green
                    - yellow
                    - red
                    - unknown
                reasons:
                  type: array
                  items:
                    type: string
              required:
                - diskId
                - previous
                - current
                - reasons
              additionalProperties: false
          required:
            - seq
            - id
            - type
            - occurredAt
            - payload
          additionalProperties: false
        - type: object
          properties:
            seq:
              type: integer
              exclusiveMinimum: 0
            id:
              type: string
              minLength: 1
            type:
              type: string
              const: capacity.low
            occurredAt:
              type: string
              format: date-time
            payload:
              type: object
              properties:
                diskId:
                  type: string
                totalBytes:
                  type: integer
                  minimum: 0
                freeBytes:
                  type: integer
                  minimum: 0
                freePercent:
                  type: number
                daysUntilFull:
                  type:
                    - number
                    - "null"
              required:
                - diskId
                - totalBytes
                - freeBytes
                - freePercent
                - daysUntilFull
              additionalProperties: false
          required:
            - seq
            - id
            - type
            - occurredAt
            - payload
          additionalProperties: false
        - type: object
          properties:
            seq:
              type: integer
              exclusiveMinimum: 0
            id:
              type: string
              minLength: 1
            type:
              type: string
              const: backup.completed
            occurredAt:
              type: string
              format: date-time
            payload:
              type: object
              properties:
                jobId:
                  type: string
                policyId:
                  type: string
                projectId:
                  type: string
                filesCopied:
                  type: integer
                  minimum: 0
                bytesCopied:
                  type: integer
                  minimum: 0
                filesSkipped:
                  type: integer
                  minimum: 0
                filesDeleted:
                  type: integer
                  minimum: 0
                durationMs:
                  type: integer
                  minimum: 0
              required:
                - jobId
                - policyId
                - projectId
                - filesCopied
                - bytesCopied
                - filesSkipped
                - filesDeleted
                - durationMs
              additionalProperties: false
          required:
            - seq
            - id
            - type
            - occurredAt
            - payload
          additionalProperties: false
        - type: object
          properties:
